version: 1
applications:
  - appRoot: frontend
    backend:
      phases:
        build:
          commands:
            - npm install -g @aws-amplify/backend-cli
            - cd .. && npm install && ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
            # Write environment variables from Amplify console to .env
            - echo "EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL" > .env
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
