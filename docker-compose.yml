# Self-hosting stack for AnyControl Remote (backend + MongoDB).
# The mobile app and desktop agent connect to the backend over HTTPS/WSS.
version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "anycontrol"
      JWT_SECRET: "change-me-with-a-64-char-hex-secret"
    ports:
      - "8001:8001"

volumes:
  mongo_data:
